name: Feature Request
description: Suggest a new feature, capability, or improvement for A.U.R.A.
title: "[FEATURE] "
labels: ["enhancement", "feature-request"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping shape the future of A.U.R.A.!

        A.U.R.A. is an open-source, JARVIS-inspired personal AI assistant developed by CodeCrafters. Your ideas and recommendations help make it more intelligent, capable, and useful.

        Please describe your feature clearly so we can understand and evaluate your proposal.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this feature solve?
      description: Describe the problem, limitation, or inconvenience you want to address.
      placeholder: |
        Currently, A.U.R.A. cannot...
        This makes it difficult to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Feature
      description: Explain the feature or functionality you would like A.U.R.A. to have.
      placeholder: |
        I would like A.U.R.A. to...
        The feature should allow users to...
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which area of A.U.R.A. would this feature improve?
      options:
        - AI & Intelligence
        - Voice & Speech
        - Desktop Automation
        - Agent System
        - Browser & Web Interaction
        - Memory & Personalization
        - System Controls
        - User Interface & Experience
        - Local AI & Offline Capabilities
        - Plugins & Integrations
        - Security & Privacy
        - Performance & Optimization
        - Developer Experience
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Suggested Implementation (Optional)
      description: Have an idea about how this could be implemented? Share it here.
      placeholder: |
        Possible implementation:
        - ...
        - ...
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or Related Projects (Optional)
      description: Have you seen something similar elsewhere? Share examples or alternative approaches.
      placeholder: Links, examples, or references...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, mockups, diagrams, examples, or anything else that could help explain your idea.
      validations:
        required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Checklist
      options:
        - label: I have checked that a similar feature request does not already exist.
          required: true
        - label: I have described the feature clearly and its intended benefits.
          required: true