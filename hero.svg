<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#180e04" />
      <stop offset="50%" stop-color="#0a0602" />
      <stop offset="100%" stop-color="#030303" />
    </radialGradient>

    <radialGradient id="coreInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffbe6b" stop-opacity="1" />
      <stop offset="35%" stop-color="#ff8c00" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#d95200" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="coreOuter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7700" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#aa3300" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowIntense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="hudGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff8c00" stroke-width="0.5" stroke-opacity="0.07" />
      <circle cx="40" cy="40" r="1" fill="#ff8c00" fill-opacity="0.15" />
    </pattern>

    <pattern id="dotDot" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ff8c00" fill-opacity="0.1" />
    </pattern>
  </defs>

  <style>
    .font-title { font-family: 'Segoe UI', -apple-system, Roboto, 'Helvetica Neue', sans-serif; font-weight: 800; letter-spacing: 0.4em; }
    .font-mono { font-family: 'Consolas', 'Courier New', 'Roboto Mono', monospace; }
    .font-sans { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; }
    
    .amber-bright { fill: #ffbe6b; stroke: #ffbe6b; }
    .amber-main { fill: #ff8c00; stroke: #ff8c00; }
    .amber-dim { fill: #b35900; stroke: #b35900; }
    
    .hud-line { stroke: #ff8c00; stroke-opacity: 0.4; stroke-width: 1; fill: none; }
    .hud-line-bright { stroke: #ffbe6b; stroke-opacity: 0.8; stroke-width: 1.2; fill: none; }
    .hud-line-dim { stroke: #804000; stroke-opacity: 0.3; stroke-width: 1; fill: none; }
    
    .label-title { font-size: 11px; font-weight: 700; fill: #ffbe6b; letter-spacing: 0.15em; }
    .label-sub { font-size: 9px; fill: #a66e38; letter-spacing: 0.05em; }
    .val-text { font-size: 10px; fill: #ff8c00; font-weight: 600; }
  </style>

  <rect width="1280" height="640" fill="url(#bgGlow)" />

  <rect width="1280" height="640" fill="url(#hudGrid)" />
  <rect width="1280" height="640" fill="url(#dotDot)" />

  <path d="M 40 80 L 40 40 L 80 40" class="hud-line-bright" />
  <path d="M 1200 40 L 1240 40 L 1240 80" class="hud-line-bright" />
  <path d="M 40 560 L 40 600 L 80 600" class="hud-line-bright" />
  <path d="M 1200 600 L 1240 600 L 1240 560" class="hud-line-bright" />
  
  <line x1="90" y1="40" x2="1190" y2="40" class="hud-line-dim" />
  <line x1="90" y1="600" x2="1190" y2="600" class="hud-line-dim" />
  <line x1="40" y1="90" x2="40" y2="550" class="hud-line-dim" />
  <line x1="1240" y1="90" x2="1240" y2="550" class="hud-line-dim" />

  <text x="50" y="55" class="font-mono label-sub" font-size="8">SYS.LOC // 0x7F89B</text>
  <text x="1180" y="55" class="font-mono label-sub" font-size="8">SECURE NODE // ACTIVE</text>

  <g transform="translate(640, 330)">
    <circle cx="0" cy="0" r="230" fill="url(#coreOuter)" />
    <circle cx="0" cy="0" r="160" fill="url(#coreOuter)" />

    <circle cx="0" cy="0" r="220" class="hud-line-dim" stroke-dasharray="4 8" />
    <circle cx="0" cy="0" r="200" class="hud-line" stroke-dasharray="150 15 40 15 80 15" />
    <circle cx="0" cy="0" r="185" class="hud-line-bright" stroke-dasharray="1 6" />

    <path d="M -141 -141 A 200 200 0 0 1 141 -141" class="hud-line-bright" stroke-width="2" stroke-dasharray="180 30 40 30" />
    <path d="M 141 141 A 200 200 0 0 1 -141 141" class="hud-line-bright" stroke-width="2" stroke-dasharray="120 20 90 20" />
    
    <g class="amber-main" opacity="0.4">
      <line x1="0" y1="-175" x2="0" y2="-180" stroke-width="2" />
      <line x1="175" y1="0" x2="180" y2="0" stroke-width="2" />
      <line x1="0" y1="175" x2="0" y2="180" stroke-width="2" />
      <line x1="-175" y1="0" x2="-180" y2="0" stroke-width="2" />
      <line x1="123" y1="123" x2="127" y2="127" stroke-width="1.5" />
      <line x1="-123" y1="-123" x2="-127" y2="-127" stroke-width="1.5" />
      <line x1="123" y1="-123" x2="127" y2="-127" stroke-width="1.5" />
      <line x1="-123" y1="123" x2="-127" y2="127" stroke-width="1.5" />
    </g>

    <circle cx="0" cy="0" r="150" class="hud-line" stroke-dasharray="60 10 10 10 30 10" />
    <circle cx="0" cy="0" r="135" class="hud-line-dim" />
    
    <ellipse cx="0" cy="0" rx="145" ry="50" class="hud-line-bright" stroke-opacity="0.6" transform="rotate(25)" />
    <ellipse cx="0" cy="0" rx="145" ry="50" class="hud-line-bright" stroke-opacity="0.6" transform="rotate(-35)" />
    <ellipse cx="0" cy="0" rx="150" ry="30" class="hud-line" stroke-opacity="0.4" transform="rotate(75)" />

    <circle cx="0" cy="0" r="110" class="hud-line-bright" stroke-width="1.5" stroke-dasharray="80 15 80 15" />
    <circle cx="0" cy="0" r="95" class="hud-line" stroke-dasharray="3 3" />

    <circle cx="0" cy="0" r="85" fill="url(#coreInner)" filter="url(#glowIntense)" />
    <circle cx="0" cy="0" r="55" fill="#ff9d00" opacity="0.5" filter="url(#glowSubtle)" />
    <circle cx="0" cy="0" r="25" fill="#ffe2b3" opacity="0.8" filter="url(#glowSubtle)" />

    <g class="hud-line-bright" opacity="0.7">
      <line x1="-35" y1="0" x2="-12" y2="0" />
      <line x1="12" y1="0" x2="35" y2="0" />
      <line x1="0" y1="-35" x2="0" y2="-12" />
      <line x1="0" y1="12" x2="0" y2="35" />
      <circle cx="0" cy="0" r="12" fill="none" stroke="#ffbe6b" stroke-width="0.75" />
    </g>

    <circle cx="-45" cy="-25" r="1.5" fill="#ffe2b3" opacity="0.9" filter="url(#glowSubtle)" />
    <circle cx="55" cy="15" r="2" fill="#ffbe6b" opacity="0.8" filter="url(#glowSubtle)" />
    <circle cx="-20" cy="50" r="1" fill="#ffbe6b" opacity="0.7" />
    <circle cx="30" cy="-45" r="1.5" fill="#ffd199" opacity="0.9" />
    <circle cx="80" cy="-60" r="1" fill="#ff8c00" opacity="0.6" />
    <circle cx="-90" cy="40" r="1.2" fill="#ff8c00" opacity="0.5" />
    <circle cx="-60" cy="-80" r="1.8" fill="#ffbe6b" opacity="0.7" filter="url(#glowSubtle)" />
    <circle cx="100" cy="30" r="1.5" fill="#ffbe6b" opacity="0.6" />
  </g>

  <g transform="translate(640, 75)" text-anchor="middle">
    <text class="font-title amber-bright" font-size="38" x="0" y="0" filter="url(#glowIntense)">A . U . R . A</text>
    
    <text class="font-mono" font-size="11" fill="#ffaa44" letter-spacing="0.4em" x="0" y="24" opacity="0.9">AUTONOMOUS USER-RESPONSE AGENT</text>
    
    <text class="font-sans" font-size="12" fill="#d9822b" letter-spacing="0.2em" font-weight="500" x="0" y="44" opacity="0.8">THE NEXT GENERATION DESKTOP AI ASSISTANT</text>
    
    <path d="M -220 18 L -320 18" class="hud-line" />
    <circle cx="-320" cy="18" r="2" fill="#ff8c00" />
    <path d="M 220 18 L 320 18" class="hud-line" />
    <circle cx="320" cy="18" r="2" fill="#ff8c00" />
  </g>

  <g transform="translate(90, 160)">
    
    <g transform="translate(0, 0)">
      <line x1="0" y1="0" x2="110" y2="0" class="hud-line-bright" />
      <line x1="110" y1="0" x2="135" y2="25" class="hud-line-bright" />
      <circle cx="0" cy="0" r="3" fill="#ffbe6b" filter="url(#glowSubtle)" />
      <text x="0" y="-8" class="font-mono label-title">// VOICE</text>
      <text x="0" y="14" class="font-sans label-sub">Neural Speech Synthesis</text>
    </g>

    <g transform="translate(0, 75)">
      <line x1="0" y1="0" x2="140" y2="0" class="hud-line" />
      <line x1="140" y1="0" x2="170" y2="20" class="hud-line" />
      <circle cx="0" cy="0" r="3" fill="#ff8c00" />
      <text x="0" y="-8" class="font-mono label-title">// VISION</text>
      <text x="0" y="14" class="font-sans label-sub">Spatial &amp; Context OCR</text>
    </g>

    <g transform="translate(0, 150)">
      <line x1="0" y1="0" x2="160" y2="0" class="hud-line-bright" />
      <line x1="160" y1="0" x2="195" y2="-15" class="hud-line-bright" />
      <circle cx="0" cy="0" r="3" fill="#ffbe6b" filter="url(#glowSubtle)" />
      <text x="0" y="-8" class="font-mono label-title">// MEMORY</text>
      <text x="0" y="14" class="font-sans label-sub">Persistent Vector Graph</text>
    </g>

    <g transform="translate(0, 225)">
      <line x1="0" y1="0" x2="140" y2="0" class="hud-line" />
      <line x1="140" y1="0" x2="175" y2="-25" class="hud-line" />
      <circle cx="0" cy="0" r="3" fill="#ff8c00" />
      <text x="0" y="-8" class="font-mono label-title">// AUTOMATION</text>
      <text x="0" y="14" class="font-sans label-sub">Cross-App Task Execution</text>
    </g>

    <g transform="translate(0, 300)">
      <line x1="0" y1="0" x2="120" y2="0" class="hud-line-bright" />
      <line x1="120" y1="0" x2="145" y2="-30" class="hud-line-bright" />
      <circle cx="0" cy="0" r="3" fill="#ffbe6b" filter="url(#glowSubtle)" />
      <text x="0" y="-8" class="font-mono label-title">// FILES</text>
      <text x="0" y="14" class="font-sans label-sub">Deep Document Indexing</text>
    </g>

    <g transform="translate(0, 375)">
      <line x1="0" y1="0" x2="90" y2="0" class="hud-line" />
      <line x1="90" y1="0" x2="120" y2="-35" class="hud-line" />
      <circle cx="0" cy="0" r="3" fill="#ff8c00" />
      <text x="0" y="-8" class="font-mono label-title">// SYSTEM</text>
      <text x="0" y="14" class="font-sans label-sub">Native OS Integration</text>
    </g>
  </g>

  <g transform="translate(970, 180)">
    <rect x="0" y="0" width="220" height="270" fill="#120a03" rx="4" fill-opacity="0.6" stroke="#ff8c00" stroke-width="0.75" stroke-opacity="0.4" />
    
    <path d="M 0 15 L 0 0 L 15 0" class="hud-line-bright" stroke-width="1.5" />
    <path d="M 205 0 L 220 0 L 220 15" class="hud-line-bright" stroke-width="1.5" />
    <path d="M 0 255 L 0 270 L 15 270" class="hud-line-bright" stroke-width="1.5" />
    <path d="M 205 270 L 220 270 L 220 255" class="hud-line-bright" stroke-width="1.5" />

    <path d="M 15 30 L 205 30" class="hud-line-dim" />
    <text x="15" y="21" class="font-mono label-title" font-size="10">SYSTEM METRICS</text>
    <circle cx="198" cy="17" r="3" fill="#ffbe6b" filter="url(#glowSubtle)" />

    <g transform="translate(15, 55)">
      <text x="0" y="0" class="font-mono label-sub">SYSTEM STATUS</text>
      <text x="0" y="15" class="font-mono val-text" fill="#ffbe6b">● ONLINE</text>
    </g>

    <g transform="translate(15, 98)">
      <text x="0" y="0" class="font-mono label-sub">CORE VERSION</text>
      <text x="0" y="15" class="font-mono val-text">v1.0.4 // STABLE</text>
    </g>

    <g transform="translate(15, 141)">
      <text x="0" y="0" class="font-mono label-sub">NEURAL ENGINE</text>
      <text x="0" y="15" class="font-mono val-text">A.U.R.A CORE v3</text>
    </g>

    <g transform="translate(15, 184)">
      <text x="0" y="0" class="font-mono label-sub">RESPONSE LATENCY</text>
      <text x="0" y="15" class="font-mono val-text" fill="#ffbe6b">&lt; 150 ms</text>
    </g>

    <g transform="translate(15, 227)">
      <text x="0" y="0" class="font-mono label-sub">OPERATIONAL MODE</text>
      <text x="0" y="15" class="font-mono val-text">AUTONOMOUS</text>
    </g>

    <g transform="translate(205, 50)" fill="#ff8c00" opacity="0.6">
      <rect x="0" y="0" width="2" height="12" />
      <rect x="0" y="16" width="2" height="4" />
      <rect x="0" y="24" width="2" height="20" />
      <rect x="0" y="48" width="2" height="8" />
    </g>
    
    <path d="M -10 135 L -80 135" class="hud-line" stroke-dasharray="4 4" />
    <circle cx="-10" cy="135" r="2" fill="#ff8c00" />
  </g>

  <g transform="translate(640, 575)" text-anchor="middle">
    <path d="M -300 -10 L -320 -10 L -320 10 L -300 10" class="hud-line" />
    <path d="M 300 -10 L 320 -10 L 320 10 L 300 10" class="hud-line" />

    <text class="font-sans" font-size="13" fill="#ffbe6b" letter-spacing="0.25em" font-weight="600" x="0" y="3" filter="url(#glowSubtle)">
      BUILT TO THINK. DESIGNED TO ASSIST. ENGINEERED TO AUTOMATE.
    </text>

    <line x1="-180" y1="20" x2="180" y2="20" class="hud-line-dim" />
    <circle cx="0" cy="20" r="2" fill="#b35900" />
  </g>

</svg>
