llm:
  provider: ollama
  ollama:
    base_url: http://localhost:11434
    model: ''
  lmstudio:
    base_url: http://localhost:1234/v1
    model: auto
  request_timeout: 120
  max_tokens: 256
voice:
  vosk_model_path: models/vosk-model-small-en-us-0.15
  model_path: models/kokoro-v1.0.onnx
  quantized_model_path: models/kokoro-v1.0.int8.onnx
  voices_path: models/voices-v1.0.bin
  voice: bm_george
  lang: en-gb
  speed: 1.1
  wake_word: false
  wake_word_text: Hey Aura
  mic_device_index: null
agent:
  allowed_workspace_dir: workspace
  max_steps: 3
  history_length: 6
  tool_calling: auto
  scratchpad_file: .aura-task.json
